<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
<title id="t">Brainfly</title>
<desc id="d">An animated winged brain flapping its wings while thought bubbles rise. Brainfly: find all references for stories.</desc>
<style>
.wl,.wr{transform-box:fill-box;animation:flapL .55s ease-in-out infinite alternate}
.wl{transform-origin:100% 64%}
.wr{transform-origin:0% 64%;animation-name:flapR}
@keyframes flapL{from{transform:rotate(-17deg)}to{transform:rotate(13deg)}}
@keyframes flapR{from{transform:rotate(17deg)}to{transform:rotate(-13deg)}}
.bob{animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-7px)}}
.bub{transform-box:fill-box;transform-origin:center;opacity:0;animation:rise 4.2s ease-out infinite}
@keyframes rise{0%{opacity:0;transform:translateY(0) scale(.5)}14%{opacity:1}100%{opacity:0;transform:translateY(-78px) scale(1)}}
.ul{fill:none;stroke:#f59e0b;stroke-width:3.5;stroke-linecap:round;stroke-dasharray:330;animation:draw 6s ease-in-out infinite}
@keyframes draw{0%{stroke-dashoffset:330}30%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:330}}
.wing{fill:#f3e9d2;fill-opacity:.9;stroke:#f59e0b;stroke-width:1.5;stroke-linejoin:round}
.lobe{fill:#f59e0b;fill-opacity:.22;stroke:#f59e0b;stroke-width:2.4;stroke-linejoin:round}
.fold{fill:none;stroke:#f59e0b;stroke-width:1.8;stroke-linecap:round}
.bt{font:600 14px ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#f3e9d2}
.bb{fill:#0d0f14;stroke:#f59e0b;stroke-width:1.5}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.bub{opacity:.85}.ul{stroke-dashoffset:0}}
</style>
<rect width="900" height="280" rx="18" fill="#0d0f14"/>
<rect x=".75" y=".75" width="898.5" height="278.5" rx="17.5" fill="none" stroke="#f3e9d2" stroke-opacity=".14" stroke-width="1.5"/>

<g transform="translate(78,100)"><g class="bub" style="animation-delay:0s"><rect class="bb" x="0" y="0" width="78" height="28" rx="14"/><text class="bt" x="39" y="19" text-anchor="middle">what if?</text></g></g>
<g transform="translate(168,106)"><g class="bub" style="animation-delay:1.4s"><rect class="bb" x="0" y="0" width="86" height="28" rx="14"/><text class="bt" x="43" y="19" text-anchor="middle">because…</text></g></g>
<g transform="translate(120,110)"><g class="bub" style="animation-delay:2.8s"><rect class="bb" x="0" y="0" width="70" height="28" rx="14"/><text class="bt" x="35" y="19" text-anchor="middle">why?</text></g></g>

<g transform="translate(40,92) scale(1.55)"><g class="bob">
<path class="wing wl" d="M62 48C40 20 14 22 6 30C16 34 20 42 14 50C26 50 34 56 30 66C44 64 54 58 62 54Z"/>
<path class="wing wr" d="M98 48C120 20 146 22 154 30C144 34 140 42 146 50C134 50 126 56 130 66C116 64 106 58 98 54Z"/>
<path class="lobe" d="M80 28C70 18 50 22 50 40C42 44 44 58 54 62C56 72 72 74 80 68Z"/>
<path class="lobe" d="M80 28C90 18 110 22 110 40C118 44 116 58 106 62C104 72 88 74 80 68Z"/>
<path class="fold" d="M60 40C66 36 72 42 78 38M58 54C64 50 70 56 77 52M100 40C94 36 88 42 82 38M102 54C96 50 90 56 83 52"/>
</g></g>

<text x="338" y="150" font-family="Georgia,'Times New Roman',serif" font-weight="800" font-size="88" fill="#f3e9d2" letter-spacing="-2">Brain<tspan fill="#f59e0b">fly</tspan></text>
<path class="ul" d="M342 170C420 164 520 174 600 168"/>
<text x="340" y="212" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="27" fill="#9aa3b2">Find all references for stories.</text>
<text x="340" y="246" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#6b7585">Change one early fact. See every line it breaks.</text>
